server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The application is a single-page app: unknown paths serve the shell so
    # client-side routing works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable and can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API is proxied to the backend so the browser only ever talks to one
    # origin and the access token never crosses a CORS boundary.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
