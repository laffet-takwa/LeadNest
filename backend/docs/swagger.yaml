          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Get AI interaction history
      tags:
      - ai
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies email and password, rejects inactive accounts, and returns
        an access token.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.loginRequest'
      produces:
      - application/json
      responses:
