host: localhost:8080
info:
  contact:
    email: api@leadnest.example
    name: LeadNest API Support
  description: |-
    LeadNest is an AI-powered CRM for small businesses. This API manages companies, employees, customers, sales deals, follow-up tasks, activity timelines, dashboard analytics and AI-assisted drafting.
    All endpoints are prefixed with /api/v1. Authenticated endpoints require an `Authorization: Bearer <token>` header. Every query is scoped to the caller's company.
  license:
    name: MIT
  termsOfService: https://example.com/terms
  title: LeadNest API
  version: "1.0"
paths:
  /api/v1/activities:
    get:
      description: Returns activities of the authenticated user's company in reverse
        chronological order.
      parameters:
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      - description: Filter by customer
        in: query
        name: customer_id
        type: string
      - description: Filter by deal
        in: query
        name: deal_id
        type: string
      - description: Filter by author
        in: query
        name: user_id
        type: string
      - description: Filter by activity type
        in: query
        name: type
        type: string
      - description: Lower bound on occurred_at
        in: query
        name: from
        type: string
      - description: Upper bound on occurred_at
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Activity'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: List activities
      tags:
      - activities
  /api/v1/activities/{id}:
    get:
      description: Returns an activity of the authenticated user's company.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Success'
            - properties:
                data:
                  $ref: '#/definitions/models.Activity'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Get an activity
      tags:
      - activities
  /api/v1/ai/customer-summary:
    post:
      consumes:
      - application/json
      description: Summarizes customer information and recent activity history. The
        output is a suggestion, not a verified record.
      parameters:
      - description: Summary request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ai.customerSummaryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Success'
            - properties:
                data:
                  $ref: '#/definitions/ai.customerSummaryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Summarize a customer
      tags:
      - ai
  /api/v1/ai/email-draft:
    post:
      consumes:
      - application/json
      description: Generates a professional follow-up email draft from customer and
        deal information. The output is a suggestion and requires human review before
        sending.
      parameters:
      - description: Draft request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ai.emailDraftRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Success'
            - properties:
                data:
                  $ref: '#/definitions/ai.emailDraftResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Generate an email draft
      tags:
      - ai
  /api/v1/ai/follow-up-suggestions:
    post:
      consumes:
      - application/json
      description: Suggests customers and open deals that may need follow-up based
        on CRM data. Suggestions require human confirmation.
      parameters:
      - description: Follow-up request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ai.followUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Success'
