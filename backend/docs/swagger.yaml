                data:
                  $ref: '#/definitions/ai.followUpResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Suggest follow-ups
      tags:
      - ai
  /api/v1/ai/history:
    get:
      description: Returns the AI interaction metadata recorded for the authenticated
        user's company.
      parameters:
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      - description: Filter by interaction type
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AIInteraction'
                  type: array
